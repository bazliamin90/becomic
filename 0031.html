<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script src="header.js"></script>
  <title>SPSS 1</title>

  <!-- PDF.js base CSS -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf_viewer.min.css" />
  <link rel="stylesheet" href="pdfstyle.css" />
</head>
<body>
  <!-- Controls -->
  <div id="controls">
    <header3-component></header3-component>

    <label>
      <input type="number" id="pageInput" value="1" min="1" style="width:4rem">
    </label>
    <span id="pageCount">/--</span>

    <label style="margin-left:1rem">
      <select id="zoomSelect">
        <option value="0.5">50%</option>
        <option value="1">100%</option>
        <option value="1.5">150%</option>
        <option value="2">200%</option>
        <option value="3">300%</option>
        <option value="page-width">Fit W</option>
        <option value="page-height">Fit H</option>
      </select>
    </label>
  </div>

  <!-- PDF container -->
  <div id="viewerContainer">
    <div id="viewer" class="pdfViewer"></div>
    <div id="sliderContainer">
      <button id="prevPage">◀</button>
      <input type="range" id="pageSlider" min="1" max="1" value="1">
      <button id="nextPage">▶</button>
    </div>
  </div>

  <!-- PDF.js scripts -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf_viewer.min.js"></script>
  <script>
  if ("scrollRestoration" in history) {
    history.scrollRestoration = "manual";
  }

  window.addEventListener("load", () => {
    window.scrollTo(0, 0);
  });

  pdfjsLib.GlobalWorkerOptions.workerSrc =
    "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

  const container = document.getElementById("viewerContainer");
  const viewerEl = document.getElementById("viewer");

  const eventBus = new pdfjsViewer.EventBus();
  const linkService = new pdfjsViewer.PDFLinkService({ eventBus });
  const findController = new pdfjsViewer.PDFFindController({ eventBus, linkService });

  // 🔽 SCROLL VIEWER
  const viewer = new pdfjsViewer.PDFViewer({
    container,
    viewer: viewerEl,
    eventBus,
    linkService,
    findController,
    textLayerMode: 2,
  });

  linkService.setViewer(viewer);

  let pdfDoc = null;

  const pageKey = location.pathname.split("/").pop().replace(/\.[^/.]+$/, "");
  const lastPageKey = pageKey + "_lastPage";
  const lastZoomKey = pageKey + "_lastZoom";

  const pageInput = document.getElementById("pageInput");
  const pageCount = document.getElementById("pageCount");
  const pageSlider = document.getElementById("pageSlider");
  const zoomSelect = document.getElementById("zoomSelect");

  async function openPDF(url) {
    try {
      const loadingTask = pdfjsLib.getDocument(url);
      pdfDoc = await loadingTask.promise;

      viewer.setDocument(pdfDoc);
      linkService.setDocument(pdfDoc, null);

    } catch (err) {
      console.error("PDF load failed", err);
      alert("Failed to load PDF");
    }
  }

  // Your Google Drive file ID
const fileId = "1sD1ZnTp0ye4ze5fgTUrPZU5RClMEH1Jn";

// Your Apps Script Web App URL
const webAppUrl =
  "https://script.google.com/macros/s/AKfycbybEnjqqY6yuKaZFJn9-82GK1pKHmven8o8OH2gJsNkZzE6KiJJ0A1IjP1En7O9LZD3/exec";

// Request secure PDF URL
fetch(`${webAppUrl}?fileId=${fileId}`)
  .then(res => res.json())
  .then(data => {

    if (data.url) {
      openPDF(data.url);
    } else {
      console.error("Failed to get PDF URL");
    }

  })
  .catch(err => {
    console.error("Error:", err);
  });

  // When pages are ready
  eventBus.on("pagesinit", () => {
    window.scrollTo(0, 0);

    // Restore zoom
    const savedZoom = localStorage.getItem(lastZoomKey);
    if (savedZoom) {
      viewer.currentScaleValue = savedZoom;
      zoomSelect.value = savedZoom;
    } else {
      viewer.currentScaleValue = window.innerWidth < 768 ? "page-width" : "auto";
    }

    pageCount.textContent = "/" + pdfDoc.numPages;
    pageInput.max = pdfDoc.numPages;
    pageSlider.max = pdfDoc.numPages;

    // Restore page
    const savedPage = parseInt(localStorage.getItem(lastPageKey), 10);
    if (savedPage) {
      viewer.currentPageNumber = savedPage;
    }

    pageInput.value = viewer.currentPageNumber;
    pageSlider.value = viewer.currentPageNumber;
  });

  // Track page while scrolling
  eventBus.on("pagechanging", (e) => {
    pageInput.value = e.pageNumber;
    pageSlider.value = e.pageNumber;
    localStorage.setItem(lastPageKey, e.pageNumber);
  });

  // Page input jump
  pageInput.addEventListener("change", (e) => {
    const page = parseInt(e.target.value, 10);
    if (page >= 1 && page <= pdfDoc.numPages) {
      viewer.currentPageNumber = page;
    } else {
      e.target.value = viewer.currentPageNumber;
    }
  });

  // Prev / Next
  document.getElementById("prevPage").addEventListener("click", () => {
    if (viewer.currentPageNumber > 1) {
      viewer.currentPageNumber--;
    }
  });

  document.getElementById("nextPage").addEventListener("click", () => {
    if (viewer.currentPageNumber < pdfDoc.numPages) {
      viewer.currentPageNumber++;
    }
  });

  // Slider
  pageSlider.addEventListener("input", (e) => {
    viewer.currentPageNumber = parseInt(e.target.value, 10);
  });

  // Zoom dropdown
  zoomSelect.addEventListener("change", (e) => {
    viewer.currentScaleValue = e.target.value;
    localStorage.setItem(lastZoomKey, e.target.value);
  });

  // Keyboard shortcuts (safe)
  document.addEventListener("keydown", (e) => {
    if (
      e.target.tagName === "INPUT" ||
      e.target.tagName === "SELECT" ||
      e.target.isContentEditable
    ) return;

    switch (e.key) {
      case "ArrowUp":
        viewer.container.scrollBy({ top: -150, behavior: "smooth" });
        break;
      case "ArrowDown":
        viewer.container.scrollBy({ top: 150, behavior: "smooth" });
        break;
      case "+":
      case "=":
        viewer.currentScale = Math.min(viewer.currentScale + 0.25, 3);
        localStorage.setItem(lastZoomKey, viewer.currentScale);
        break;
      case "-":
        viewer.currentScale = Math.max(viewer.currentScale - 0.25, 0.5);
        localStorage.setItem(lastZoomKey, viewer.currentScale);
        break;
    }
  });

  // --- SEARCH ---
  const searchInput = document.getElementById("searchInput");
  const findNextBtn = document.getElementById("findNext");
  const findPrevBtn = document.getElementById("findPrev");
  const resetBtn = document.getElementById("findReset");

  function doSearch(forward = true) {
    if (!searchInput) return;
    const query = searchInput.value.trim();
    if (!query) return;

    eventBus.dispatch("find", {
      source: searchInput,
      type: "again",
      query,
      highlightAll: true,
      findPrevious: !forward,
    });
  }

  findNextBtn?.addEventListener("click", () => doSearch(true));
  findPrevBtn?.addEventListener("click", () => doSearch(false));

  searchInput?.addEventListener("keydown", (e) => {
    if (e.key === "Enter") doSearch(true);
  });

  resetBtn?.addEventListener("click", () => {
    searchInput.value = "";
    eventBus.dispatch("find", {
      source: searchInput,
      type: "again",
      query: "",
      highlightAll: false,
    });
  });
</script>

</body>
</html>
